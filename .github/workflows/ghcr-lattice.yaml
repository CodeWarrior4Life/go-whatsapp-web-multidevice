name: ghcr-lattice

# Lattice fork build: pushes the patched image to GHCR for the cypher deploy.
# Upstream's own workflows run only on semver tags, which this fork never pushes.
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/interactive-press-ci"
      - "lattice/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/golang.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/codewarrior4life/gowa:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
