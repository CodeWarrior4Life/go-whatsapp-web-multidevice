name: ghcr-lattice

# Lattice fork build: pushes the patched image to GHCR for the cypher deploy.
# Upstream's own workflows run only on semver tags, which this fork never pushes.
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/interactive-press"
      - "lattice/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "short=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/golang.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/codewarrior4life/gowa:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
